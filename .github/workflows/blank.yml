name: Minecraft Mod Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unrar Files
        run: |
          sudo apt-get install unrar
          unrar x -o+ meteor-addon-template-master.rar

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reset and Inject Required Properties
        run: |
          # Kodun hata vermemesi için eksik olan tüm değişkenleri tek tek içeri enjekte ediyoruz
          cat << EOF > gradle.properties
          archives_base_name=ZincAddon
          maven_group=com.vrzt.zinc
          
          # Replit'in bozduğu veya eksik kalan diğer temel ayarlar
          org.gradle.jvmargs=-Xmx3G
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zinc-Addon-1.21.8
          path: build/libs/*.jar
